<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Petrol Pump Credit Manager</title>
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#14201b;--muted:#5d6b66;--line:#e0e6e3;--brand:#0f5c4d;--brand2:#0b4639;--brandSoft:#e2f1ec;--accent:#e8a317;--danger:#b93a2e;--dangerSoft:#fcebe9;--warn:#9a6200;--warnSoft:#fff3d9;--ok:#1d7a48;--okSoft:#e2f4e8;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Gurmukhi",sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--brand)}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--brand2);color:#fff;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 16px;font-weight:700;line-height:1.2}
.brand .logo{width:36px;height:36px;border-radius:10px;background:#fff1;display:grid;place-items:center;font-size:20px;flex:none}
.brand small{display:block;font-weight:400;opacity:.75;font-size:12px}
.side a{display:flex;gap:10px;align-items:center;color:#d4eae3;text-decoration:none;padding:10px 12px;border-radius:10px;margin:2px 0}
.side a:hover{background:#ffffff12}
.side a.on{background:#ffffff22;color:#fff;font-weight:600}
.side .cnt,.bottom .cnt{background:var(--accent);color:#1b1300;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:auto}
.top{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;min-height:54px}
.top .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top select{width:auto;padding:6px 8px}
.who{font-size:13px;color:var(--muted);white-space:nowrap}
main{padding:18px;max-width:1180px;width:100%;margin:0 auto}
.bottom{display:none}
.mtitle{display:none}
@media (max-width:899px){
  .shell{grid-template-columns:1fr}.side{display:none}
  main{padding:12px 12px 96px}
  .who .nm{display:none}
  .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom));z-index:10}
  .bottom a{flex:1;text-align:center;font-size:11px;color:var(--muted);text-decoration:none;padding:3px 0;position:relative}
  .bottom a .i{display:block;font-size:21px;line-height:1.2}
  .bottom a.on{color:var(--brand);font-weight:700}
  .bottom .cnt{position:absolute;top:-2px;left:56%;margin:0}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi{margin:0}.kpi .l{font-size:12px;color:var(--muted);font-weight:600}.kpi .v{font-size:23px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hl{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
h1{font-size:20px;margin:2px 0 14px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 8px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid #cdd7d3;border-radius:10px;font:inherit;background:#fff;color:inherit;min-height:42px}
input[readonly]{background:#f5f7f6}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.full{grid-column:1/-1}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;padding:9px 15px;border-radius:10px;border:1px solid #cdd7d3;background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;min-height:42px;white-space:nowrap}
.btn:hover{background:#f6f8f7}.btn:disabled{opacity:.55;cursor:wait}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.p:hover{background:var(--brand2)}
.btn.d{background:#fff;border-color:#e8b9b3;color:var(--danger)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;min-height:34px}
.btn.big{width:100%;padding:13px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:#f7f9f8;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:700;background:#f7f9f8}
tr.click{cursor:pointer}tr.click:hover td{background:#f6faf8}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:#eef1f0;color:var(--muted);white-space:nowrap}
.chip.pending,.chip.warn{background:var(--warnSoft);color:var(--warn)}
.chip.approved,.chip.ok{background:var(--okSoft);color:var(--ok)}
.chip.rejected,.chip.bad{background:var(--dangerSoft);color:var(--danger)}
.alert{padding:10px 12px;border-radius:10px;margin:6px 0;font-size:14px}
.alert.warn{background:var(--warnSoft);color:#5f3d00}.alert.bad{background:var(--dangerSoft);color:#7a221a}.alert.info{background:var(--brandSoft);color:var(--brand2)}
.muted{color:var(--muted)}.small{font-size:12px}.b{font-weight:700}.num{font-variant-numeric:tabular-nums}
.red{color:var(--danger)}.green{color:var(--ok)}
.seg{display:inline-flex;border:1px solid #cdd7d3;border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:#fff;padding:8px 13px;font:inherit;cursor:pointer;min-height:40px}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(8,20,16,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal.hidden{display:none}
.modal .box{background:#fff;width:100%;max-width:660px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:16px}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#14201b;color:#fff;padding:11px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:92vw;text-align:center}
#toast.show{opacity:1}
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 2px);background:#fff;border:1px solid var(--line);border-radius:10px;max-height:280px;overflow:auto;z-index:20;box-shadow:0 10px 28px rgba(0,0,0,.14);display:none}
.combo-list.open{display:block}
.combo-list>div{padding:9px 12px;cursor:pointer;border-bottom:1px solid #f0f3f2}
.combo-list>div:hover{background:var(--brandSoft)}
.item{display:flex;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.total-box{background:var(--brandSoft);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:20px;color:var(--brand2)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.center .card{max-width:460px;width:100%}
.rates{display:flex;gap:10px;flex-wrap:wrap}
.rate{flex:1;min-width:120px;background:#f7f9f8;border-radius:10px;padding:10px 12px}
.rate .v{font-size:22px;font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs a{padding:7px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px;cursor:pointer}
.tabs a.on{background:var(--brand);border-color:var(--brand);color:#fff}
.empty{padding:22px;text-align:center;color:var(--muted)}
.bill{background:#fff;padding:26px;border:1px solid var(--line);border-radius:12px;max-width:860px;margin:auto}
.bill .hd{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:12px;flex-wrap:wrap}
.bill .pn{font-size:22px;font-weight:800}
.bill table{font-size:13px}
.bill th,.bill td{padding:6px 8px}
.sumtbl td{border:0;padding:3px 8px}
.demo-bar{background:var(--accent);color:#1b1300;font-size:13px;padding:5px 12px;text-align:center}
.demo-bar button{border:0;background:#1b130022;border-radius:6px;padding:2px 8px;margin-left:6px;font:inherit;cursor:pointer}
@media print{
  .side,.bottom,.top,.noprint,.demo-bar{display:none!important}
  body,html{background:#fff}main{padding:0;max-width:none}.shell{display:block}
  .bill{border:0;padding:0;max-width:none}.card{border:0;padding:0}
  .tw{border:0;overflow:visible}
}
</style>
</head>

function inWords(n){
  n=Math.round(Math.abs(num(n)));
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
  const three=x=>x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' '+two(x%100):''):two(x);
  const rec=x=>{ if(x===0) return ''; const cr=Math.floor(x/1e7), rest=x%1e7, l=Math.floor(rest/1e5), th=Math.floor((rest%1e5)/1000), h=rest%1000;
    return [cr?rec(cr)+' Crore':'', l?two(l)+' Lakh':'', th?two(th)+' Thousand':'', h?three(h):''].filter(Boolean).join(' '); };
  return 'Rupees '+(n===0?'Zero':rec(n))+' Only';
}

/* ===================== ledger / billing logic ===================== */
function calcTo(c,from){
  switch(c.cycle){
    case 'weekly': return addDays(from,6);
    case 'fortnightly': return addDays(from,14);
    case 'monthly': return endOfMonth(from);
    case 'custom': return addDays(from,Math.max(1,num(c.cycle_days)||30)-1);
    default: return null; // seasonal = manual only
  }
}
function billPeriod(c,s,lb){
  const e=s.earliestUnbilled; if(!e) return {from:null,to:null,has:false};
  let from=lb?addDays(lb.period_to,1):e; let to=calcTo(c,from);
  if(to&&e>to){ from=c.cycle==='monthly'?e.slice(0,8)+'01':e; to=calcTo(c,from); }
  return {from,to,has:!!to&&e<=to};
}
function computeStats(D=S.data){
  const m=new Map(), td=today();
  for(const c of D.customers) m.set(c.id,{approved:0,pending:0,unbilledCredits:0,earliestUnbilled:null,lastActivity:null});
  for(const tx of D.transactions){
    const s=m.get(tx.customer_id); if(!s||tx.status==='rejected') continue;
    const a=num(tx.amount)*sgn(tx);
    if(tx.status==='approved'){
      s.approved+=a;
      if(!tx.bill_id){ if(!DEBIT.has(tx.kind)) s.unbilledCredits+=num(tx.amount); if(!s.earliestUnbilled||tx.date<s.earliestUnbilled) s.earliestUnbilled=tx.date; }
    } else s.pending+=a;
    if(!s.lastActivity||tx.date>s.lastActivity) s.lastActivity=tx.date;
  }
  const last=new Map();
  for(const b of D.bills){ const l=last.get(b.customer_id); if(!l||b.period_to>l.period_to||(b.period_to===l.period_to&&num(b.bill_no)>num(l.bill_no))) last.set(b.customer_id,b); }
  for(const c of D.customers){
    const s=m.get(c.id); s.approved=r2(s.approved); s.pending=r2(s.pending); s.total=r2(s.approved+s.pending);
    const lb=last.get(c.id)||null; s.lastBill=lb;
    s.overdueAmt=lb?Math.max(0,r2(num(lb.closing)-s.unbilledCredits)):0;
    s.overdue=!!(lb&&lb.due_date<td&&s.overdueAmt>0.5);
    s.limit=num(c.credit_limit); s.usePct=s.limit>0?s.total/s.limit:0;
    s.overLimit=s.limit>0&&s.total>s.limit; s.nearLimit=s.limit>0&&!s.overLimit&&s.usePct>=0.9;
    s.period=billPeriod(c,s,lb); s.billDue=!!(c.active!==false&&s.period.to&&s.period.to<td&&s.period.has);
  }
  return m;
}
function computeBill(c,from,to,txs,lastB){
  const items=txs.filter(x=>x.customer_id===c.id&&x.status==='approved'&&!x.bill_id&&x.date<=to).sort(byDate);
  let debits=0,credits=0; for(const x of items){ if(DEBIT.has(x.kind)) debits+=num(x.amount); else credits+=num(x.amount); }
  let interest=0,interestNote='';
  const rate=num(c.interest_rate);
  if(rate>0&&lastB&&lastB.due_date<to){
    const paidByDue=items.filter(x=>!DEBIT.has(x.kind)&&x.date<=lastB.due_date).reduce((a,x)=>a+num(x.amount),0);
    const unpaid=r2(num(lastB.closing)-paidByDue);
    if(unpaid>0){ const d=daysBetween(lastB.due_date,to); interest=r2(unpaid*rate/100*d/30); interestNote=`${rate}% p.m. on ${money(unpaid)} × ${d} days (bill #${lastB.bill_no})`; }
  }
  const opening=lastB?num(lastB.closing):0;
  if(items.length&&items[0].date<from) from=items[0].date;
  return {items,from,to,opening:r2(opening),debits:r2(debits),credits:r2(credits),interest,interestNote,
    closing:r2(opening+debits+interest-credits),due_date:addDays(to,num(c.due_days)),
    pendingCount:txs.filter(x=>x.customer_id===c.id&&x.status==='pending'&&x.date<=to).length};
}
async function saveBill(c,cb){
  const ids=cb.items.map(x=>x.id);
  if(cb.interest>0){ const it=await B.insert('transactions',{kind:'interest',customer_id:c.id,date:cb.to,amount:cb.interest,note:cb.interestNote}); ids.push(it.id); }
  const bill=await B.insert('bills',{customer_id:c.id,period_from:cb.from,period_to:cb.to,opening:cb.opening,debits:cb.debits,credits:cb.credits,interest:cb.interest,closing:cb.closing,due_date:cb.due_date});
  if(ids.length) await B.updateMany('transactions',ids,{bill_id:bill.id});
  return bill;
}
function ageing(cid,asOf,D=S.data){
  const txs=D.transactions.filter(x=>x.customer_id===cid&&x.status==='approved'&&x.date<=asOf).sort(byDate);
  let credit=txs.filter(x=>!DEBIT.has(x.kind)).reduce((a,x)=>a+num(x.amount),0);
  const b=[0,0,0,0]; let total=0;
  for(const x of txs.filter(x=>DEBIT.has(x.kind))){
    let amt=num(x.amount); const use=Math.min(credit,amt); credit-=use; amt-=use;
    if(amt>0.001){ const age=daysBetween(x.date,asOf); b[age<=30?0:age<=60?1:age<=90?2:3]+=amt; total+=amt; }
  }
  return {total:r2(total-credit),b:b.map(r2)};
}

class LocalBackend{
  constructor(){ this.kind='demo'; this.key='ppcm_demo_v1'; }
  async init(){ this.db=LS.get(this.key)||seedDemo(); this.save(); }
  save(){ LS.set(this.key,this.db); }
  me(){ return this.db.profiles.find(p=>p.id===this.db.currentUser)||null; }
  async getSession(){ const p=this.me(); return p?{profile:clone(p)}:null; }
  async loginAs(id){ this.db.currentUser=id; this.save(); }
  async signOut(){ this.db.currentUser=null; this.save(); }
  async list(tb){ return clone(this.db[tb]||[]); }
  async insert(tb,row){
    const me=this.me(); if(!me) throw new Error('Not logged in');
    const own=me.role==='owner'&&me.active;
    if(tb!=='transactions'&&!own) throw new Error(t('err_owner'));
    const r={...row,id:uid(),created_at:new Date().toISOString()};
    if(tb==='transactions'){
      if(!own&&!['slip','payment'].includes(r.kind)) throw new Error(t('err_owner'));
      r.created_by=me.id; r.bill_id=null;
      if(own){ r.status='approved'; r.approved_by=me.id; r.approved_at=r.created_at; } else { r.status='pending'; r.approved_by=null; r.approved_at=null; }
    }
    if(tb==='bills'){ r.bill_no=this.db.bills.reduce((m,b)=>Math.max(m,num(b.bill_no)),0)+1; r.created_by=me.id; }
    this.db[tb].push(r); this.save(); return clone(r);
  }
  async update(tb,id,patch){
    const me=this.me(); if(!me||me.role!=='owner') throw new Error(t('err_owner'));
    const r=this.db[tb].find(x=>x.id===id); if(!r) throw new Error('Not found');
    if(tb==='transactions'&&patch.status&&patch.status!==r.status){ patch={...patch,approved_by:me.id,approved_at:new Date().toISOString()}; }
    Object.assign(r,patch); this.save(); return clone(r);
  }
  async updateMany(tb,ids,patch){ for(const id of ids) await this.update(tb,id,patch); }
}
class SupaBackend{
  constructor(url,key){ this.kind='cloud'; this.url=url; this.key=key; }
  async init(){
    const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    this.sb=mod.createClient(this.url,this.key,{auth:{persistSession:true,autoRefreshToken:true}});
    this.sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){ S.profile=null; S.ready=false; render(); } });
  }
  async getSession(){
    const {data:{session}}=await this.sb.auth.getSession(); if(!session) return null;
    const {data:p,error}=await this.sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
    if(error) throw error; return {user:session.user,profile:p||{id:session.user.id,email:session.user.email,role:'staff',active:false}};
  }
  async signIn(email,password){ const {error}=await this.sb.auth.signInWithPassword({email,password}); if(error) throw error; }
  async signUp(email,password,name,phone){ const {data,error}=await this.sb.auth.signUp({email,password,options:{data:{name,phone}}}); if(error) throw error; return data; }
  async signOut(){ await this.sb.auth.signOut(); }
  async list(tb){
    let all=[],from=0; const step=1000;
    for(;;){ const {data,error}=await this.sb.from(tb).select('*').order('created_at',{ascending:true}).range(from,from+step-1); if(error) throw error; all=all.concat(data); if(data.length<step) break; from+=step; }
    return all;
  }
  async insert(tb,row){ const {data,error}=await this.sb.from(tb).insert(row).select().single(); if(error) throw error; return data; }
  async update(tb,id,patch){ const {data,error}=await this.sb.from(tb).update(patch).eq('id',id).select().single(); if(error) throw error; return data; }
  async updateMany(tb,ids,patch){ for(let i=0;i<ids.length;i+=200){ const {error}=await this.sb.from(tb).update(patch).in('id',ids.slice(i,i+200)); if(error) throw error; } }
  subscribe(cb){ this.sb.channel('tx-live').on('postgres_changes',{event:'*',schema:'public',table:'transactions'},cb).subscribe(); }
}

    return tx({kind:'slip',customer_id:c.id,vehicle_id:v.id,vehicle_no:v.number,product:v.fuel,qty:q,rate:rt,amount:r2(q*rt),slip_no:String(++slipNo),driver:pick(['Balwinder','Sukhdev','Raju','Harpal','']),...extra},daysAgo); };
  for(let d=48;d>=0;d--){
    if(rnd()<0.8) fuelSlip(sharma,pick(sv),90,180,d);
    if(rnd()<0.35) fuelSlip(sharma,pick(sv),60,140,d);
    if(d%6===0) fuelSlip(gurdev,gv[0],30,60,d);
    if(d%4===1) fuelSlip(water,pick(wv),20,45,d,{po_no:'WW/IND/'+(300+d)});
    if(d%2===0) fuelSlip(amit,pick(av),4,15,d);
  }
  const lp=D.products[2]; tx({kind:'slip',customer_id:gurdev.id,vehicle_id:gv[0].id,vehicle_no:gv[0].number,product:'lube',product_id:lp.id,product_name:lp.name,qty:1,rate:lp.price,gst_rate:18,amount:lp.price,slip_no:String(++slipNo)},20);
  const rej=fuelSlip(gurdev,gv[0],40,40,9); rej.status='rejected'; rej.reject_reason='Duplicate slip'; rej.created_by=s1.id;
  const pay=(c,amt,daysAgo,mode,ref)=>tx({kind:'payment',customer_id:c.id,amount:amt,mode,ref_no:ref||''},daysAgo);
  pay(sharma,180000,20,'bank','UTR 4471902'); pay(sharma,200000,12,'cheque','Chq 004512'); pay(amit,6000,35,'upi','UPI 51882'); pay(amit,5500,26,'cash'); pay(amit,5000,19,'upi','UPI 77310');
  // generate past bills for Sharma & Amit (Water Works left ready-to-generate)
  for(const c of [sharma,amit]){
    for(let k=0;k<12;k++){
      const st=computeStats(D).get(c.id); if(!st.billDue) break;
      const cb=computeBill(c,st.period.from,st.period.to,D.transactions,st.lastBill);
      const ids=cb.items.map(x=>x.id);
      if(cb.interest>0){ const it=tx({kind:'interest',customer_id:c.id,amount:cb.interest,note:cb.interestNote,created_by:owner.id},daysBetween(cb.to,td)); it.created_by=owner.id; it.status='approved'; ids.push(it.id); }
      const bill={id:uid(),bill_no:D.bills.length+1,customer_id:c.id,period_from:cb.from,period_to:cb.to,opening:cb.opening,debits:cb.debits,credits:cb.credits,interest:cb.interest,closing:cb.closing,due_date:cb.due_date,created_by:owner.id,created_at:iso(addDays(cb.to,1))};
      D.bills.push(bill); D.transactions.forEach(x=>{ if(ids.includes(x.id)) x.bill_id=bill.id; });
    }
  }
  return D;
}

}
function closeModal(){ $('#modal').classList.add('hidden'); $('#modal .box').innerHTML=''; }
function comboHTML(id,ph){ return `<div class="combo" id="${id}"><input type="text" class="combo-in" placeholder="${esc(ph)}" autocomplete="off"><div class="combo-list"></div></div>`; }
function mountCombo(root,id,items,onChange,initial){
  const el=$('#'+id,root), inp=$('.combo-in',el), list=$('.combo-list',el); let val=null;
  const set=(v,silent)=>{ val=v||null; const it=items.find(i=>i.value===v); inp.value=it?it.label:''; list.classList.remove('open'); if(!silent) onChange(val); };
  const draw=()=>{ const q=inp.value.trim().toLowerCase(); const cur=items.find(i=>i.value===val);
    const f=items.filter(i=>!q||(cur&&q===cur.label.toLowerCase())||(i.label+' '+(i.sub||'')+' '+(i.search||'')).toLowerCase().includes(q)).slice(0,80);
    list.innerHTML=f.length?f.map(i=>`<div data-v="${esc(i.value)}"><b>${esc(i.label)}</b>${i.sub?`<div class="small muted">${esc(i.sub)}</div>`:''}</div>`).join(''):`<div class="muted">${t('nothing')}</div>`;
    list.classList.add('open'); };
  inp.addEventListener('focus',()=>{ draw(); setTimeout(()=>inp.select(),0); });
  inp.addEventListener('input',draw);
  list.addEventListener('mousedown',e=>e.preventDefault());
  list.addEventListener('click',e=>{ const d=e.target.closest('[data-v]'); if(d){ set(d.dataset.v); inp.blur(); } });
  inp.addEventListener('blur',()=>setTimeout(()=>{ list.classList.remove('open'); const it=items.find(i=>i.value===val); inp.value=it?it.label:''; },200));
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const first=$('[data-v]',list); if(first){ e.preventDefault(); set(first.dataset.v); inp.blur(); } } });
  if(initial) set(initial,false);
  return {get:()=>val,set};
}

    const setRate=()=>{ if(isLube()){ const p=S.data.products.find(p=>'lube:'+p.id===sp.value); sr.value=p?p.price:''; } else { const r=rateOn(sd.value); sr.value=r&&r[sp.value]?r[sp.value]:''; }
      $('#sql',root).textContent=isLube()?t('qty'):t('litres'); if(isLube()) setMode('qty'); $('#smode',root).style.display=isLube()?'none':''; calc(); };
    const setMode=m=>{ mode=m; $$('#smode button',root).forEach(b=>b.classList.toggle('on',b.dataset.m===m)); sq.readOnly=m!=='qty'; sa.readOnly=m!=='amt'; };
    const calc=()=>{ const rate=num(sr.value); let a=0;
      if(mode==='qty'){ const q=num(sq.value); a=r2(q*rate); sa.value=q&&rate?a.toFixed(2):''; }
      else { a=num(sa.value); sq.value=a&&rate?(Math.round(a/rate*100)/100):''; }
      $('#stot',root).textContent=money(a); warn(a); return a; };
    const warn=a=>{ const w=[]; if(!isLube()&&!num(sr.value)) w.push(`<div class="alert bad">${t('no_rate')}</div>`);
      if(cust){ const s=st.get(cust.id); if(s.limit>0&&s.total+a>s.limit) w.push(`<div class="alert bad">${t('warn_over',{a:money(s.total+a),b:money(s.limit)})}</div>`);
        if(s.overdue) w.push(`<div class="alert warn">${t('warn_overdue',{a:money(s.overdueAmt),d:fd(s.lastBill.due_date)})}</div>`); }
      $('#swarn',root).innerHTML=w.join(''); };
    const onVeh=()=>{ svo.style.display=sv.value==='__o'?'':'none'; const v=vehById(sv.value); if(v&&v.fuel&&!isLube()){ sp.value=v.fuel; setRate(); } };
    const combo=mountCombo(root,'sc',custItems(),id=>{ cust=custById(id)||null; fillVeh(); info(); calc(); },arg);
    sv.onchange=onVeh; sp.onchange=setRate; sd.onchange=setRate;
    $$('#smode button',root).forEach(b=>b.onclick=()=>{ setMode(b.dataset.m); calc(); });
    sq.oninput=calc; sa.oninput=calc; sr.oninput=calc;
    setMode('qty'); setRate();
    $('#ssave',root).onclick=act(async()=>{
      if(!cust) throw new Error(t('err_cust'));
      const a=calc(), rate=num(sr.value), q=num(sq.value);
      if(!rate) throw new Error(t('no_rate'));
      if(a<=0||q<=0) throw new Error(t('err_amt'));
      const v=vehById(sv.value), lube=isLube(), p=lube?S.data.products.find(p=>'lube:'+p.id===sp.value):null;
      const s=st.get(cust.id), over=s.limit>0&&s.total+a>s.limit;
      const row={kind:'slip',customer_id:cust.id,date:sd.value||today(),vehicle_id:v?v.id:null,vehicle_no:v?v.number:(sv.value==='__o'?svo.value.trim().toUpperCase():''),
        product:lube?'lube':sp.value,product_id:p?p.id:null,product_name:p?p.name:null,qty:q,rate,gst_rate:lube?num(p.gst_rate):0,amount:r2(a),
        slip_no:$('#ssn',root).value.trim(),driver:$('#sdr',root).value.trim(),odometer:$('#sod',root).value?num($('#sod',root).value):null,po_no:$('#spo',root).value.trim(),note:$('#sn',root).value.trim(),flags:over?'over_limit':''};
      await B.insert('transactions',row); await reload('transactions');
      toast(isOwner()?t('saved'):t('saved_pending'));
      st=computeStats(); ['sq','sa','ssn','sdr','sod','sn'].forEach(i=>$('#'+i,root).value=''); fillVeh(); info(); calc();
      $('#sq',root).focus();
    });
  }};
};

      <div class="small">${fd(x.date)} · <b>${t('k_'+x.kind)}</b> · ${esc(describeTx(x))}${x.vehicle_no?' · 🚚 '+esc(x.vehicle_no):''}${x.slip_no?' · #'+esc(x.slip_no):''}${x.po_no?' · PO '+esc(x.po_no):''}</div>

   mount(root){
     $$('[data-tab]',root).forEach(a=>a.onclick=()=>{ S.apTab=a.dataset.tab; render(); });

V.customer=(id)=>{
  const c=custById(id); if(!c) return {html:`<div class="empty">${t('nothing')}</div>`};
  const s=computeStats().get(c.id);
  const vs=S.data.vehicles.filter(v=>v.customer_id===c.id);
  const lf=S.ledgerFrom&&S.ledgerFrom[c.id]||addDays(today(),-60).slice(0,8)+'01';
  const all=S.data.transactions.filter(x=>x.customer_id===c.id&&x.status==='approved').sort(byDate);
  let bal=r2(all.filter(x=>x.date<lf).reduce((a,x)=>a+num(x.amount)*sgn(x),0)); const open=bal;
  const rows=all.filter(x=>x.date>=lf).map(x=>{ bal=r2(bal+num(x.amount)*sgn(x)); return {x,bal}; });
  const pend=S.data.transactions.filter(x=>x.customer_id===c.id&&x.status==='pending').sort(byDate);

   ${pend.length?`<div class="card"><h2>${t('pending')} (${pend.length})</h2>${pend.map(x=>txLine(x,false)).join('')}</div>`:''}
   <div class="card"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">${t('ledger')}</h2><span class="sp"></span><label style="margin:0">${t('ledger_from')}</label><input type="date" id="lf" value="${lf}" style="width:auto"><button class="btn sm" id="lcsv">⬇ CSV</button></div>

   ${bills.map(b=>{ const c=custById(b.customer_id); return `<tr class="click" data-b="${b.id}"><td>#${b.bill_no}</td><td><b>${esc(c?c.name:'?')}</b></td><td class="small">${fd(b.period_from)} → ${fd(b.period_to)}</td><td class="n b">${money(b.closing)}</td><td>${fd(b.due_date)}</td><td>${status(b)}</td></tr>`; }).join('')||`<tr><td colspan="6" class="empty">${t('nothing')}</td></tr>`}

     $$('[data-b]',root).forEach(r=>r.onclick=()=>go('#/bill/'+r.dataset.b)); }};
};

    <div style="text-align:right"><div class="b" style="font-size:16px">${t('statement')}</div><div>${t('bill_no')} <b>#${b.bill_no}</b></div><div class="small">${t('date')}: ${fd((b.created_at||'').slice(0,10))}</div><div class="small">${t('period')}: ${fd(b.period_from)} → ${fd(b.period_to)}</div></div></div>

   <div class="tw"><table><thead><tr><th>${t('date')}</th><th>${t('particulars')}</th><th>${t('vehicle')}</th><th>${t('slip_no')}</th><th class="n">${t('qty')}</th><th class="n">${t('rate')}</th><th class="n">${t('debit')}</th><th class="n">${t('credit')}</th></tr></thead><tbody>
    <tr><td></td><td class="b">${t('opening')}</td><td></td><td></td><td></td><td></td><td class="n b">${money(b.opening)}</td><td></td></tr>
    ${items.map(x=>`<tr><td>${fd(x.date)}</td><td>${x.kind==='slip'?esc(prodLabel(x)):esc(describeTx(x))}${x.po_no?` <span class="small muted">PO ${esc(x.po_no)}</span>`:''}</td><td>${esc(x.vehicle_no||'')}</td><td>${esc(x.slip_no||'')}</td><td class="n">${x.kind==='slip'?ltr(x.qty):''}</td><td class="n">${x.kind==='slip'?num(x.rate).toFixed(2):''}</td><td class="n">${DEBIT.has(x.kind)?money(x.amount):''}</td><td class="n">${DEBIT.has(x.kind)?'':money(x.amount)}</td></tr>`).join('')}
   </tbody></table></div>
   <div class="row" style="align-items:flex-start;margin-top:14px;gap:20px">
    <div style="flex:1;min-width:240px" class="small">
     <div>${t('petrol')}: <b>${ltr(fuelL('petrol'))} L</b> · ${t('diesel')}: <b>${ltr(fuelL('diesel'))} L</b></div>
     ${Object.keys(gstRows).length?`<div style="margin-top:8px"><b>${t('lube_l')} — GST</b>${Object.entries(gstRows).map(([k,v])=>`<div>${t('taxable')} ${money(v.taxable)} + ${t('gst')} ${k} ${money(v.gst)} (CGST ${money(v.gst/2)} + SGST ${money(v.gst/2)})</div>`).join('')}</div>`:''}

/* ---------- reports ---------- */
const REPORTS={
  daily(f,to){ const g={}; for(const x of S.data.transactions){ if(x.kind!=='slip'||x.status!=='approved'||x.date<f||x.date>to) continue; const r=g[x.date]=g[x.date]||[x.date,0,0,0,0,0,0];
      if(x.product==='petrol'){ r[1]+=num(x.qty); r[2]+=num(x.amount); } else if(x.product==='diesel'){ r[3]+=num(x.qty); r[4]+=num(x.amount); } else r[5]+=num(x.amount); r[6]+=num(x.amount); }
    const rows=Object.values(g).sort((a,b)=>a[0]<b[0]?-1:1); const tot=['',0,0,0,0,0,0]; rows.forEach(r=>{ for(let i=1;i<7;i++) tot[i]+=r[i]; });
    return {cols:[[t('date'),'d'],[t('petrol')+' L','l'],[t('petrol')+' ₹','m'],[t('diesel')+' L','l'],[t('diesel')+' ₹','m'],[t('lube_l')+' ₹','m'],[t('total')+' ₹','m']],rows,tot}; },
  payments(f,to){ const rows=S.data.transactions.filter(x=>x.kind==='payment'&&x.status==='approved'&&x.date>=f&&x.date<=to).sort(byDate).map(x=>[x.date,(custById(x.customer_id)||{}).name||'?',t(x.mode||'cash'),x.ref_no||'',profName(x.created_by),num(x.amount)]);
    const byMode={}; rows.forEach(r=>byMode[r[2]]=(byMode[r[2]]||0)+r[5]);
    return {cols:[[t('date'),'d'],[t('customer')],[t('mode')],[t('ref_no')],[t('created_by')],[t('amount'),'m']],rows,tot:['','','','','',rows.reduce((a,r)=>a+r[5],0)],note:Object.entries(byMode).map(([k,v])=>`${k}: ${money(v)}`).join(' · ')}; },
  ageing(f,to){ const rows=S.data.customers.map(c=>{ const a=ageing(c.id,to); return [c.name,typeLabel(c.type),c.phone||'',a.total,...a.b]; }).filter(r=>Math.abs(r[3])>0.5).sort((a,b)=>b[3]-a[3]);
    const tot=['','','',0,0,0,0,0]; rows.forEach(r=>{ for(let i=3;i<8;i++) tot[i]+=r[i]; });
    return {cols:[[t('customer')],[t('type')],[t('phone')],[t('outstanding'),'m'],['0–30','m'],['31–60','m'],['61–90','m'],['90+','m']],rows,tot,note:`${t('as_on')} ${fd(to)}`}; },
  customer(f,to){ const rows=S.data.customers.map(c=>{ const tx=S.data.transactions.filter(x=>x.customer_id===c.id&&x.status==='approved'); const inR=tx.filter(x=>x.date>=f&&x.date<=to);
      const sl=inR.filter(x=>x.kind==='slip'); const bal=tx.filter(x=>x.date<=to).reduce((a,x)=>a+num(x.amount)*sgn(x),0);
      return [c.name,typeLabel(c.type),sl.length,sl.filter(x=>x.product!=='lube').reduce((a,x)=>a+num(x.qty),0),inR.filter(x=>DEBIT.has(x.kind)).reduce((a,x)=>a+num(x.amount),0),inR.filter(x=>!DEBIT.has(x.kind)).reduce((a,x)=>a+num(x.amount),0),r2(bal)]; })
      .filter(r=>r[2]||r[5]||Math.abs(r[6])>0.5).sort((a,b)=>b[4]-a[4]);
    const tot=['','',0,0,0,0,0]; rows.forEach(r=>{ for(let i=2;i<7;i++) tot[i]+=r[i]; });
    return {cols:[[t('customer')],[t('type')],[t('fills'),'i'],[t('litres'),'l'],[t('debit'),'m'],[t('credit'),'m'],[t('balance'),'m']],rows,tot}; },
  vehicle(f,to){ const g={}; for(const x of S.data.transactions){ if(x.kind!=='slip'||x.status!=='approved'||x.date<f||x.date>to) continue; const k=(x.vehicle_no||'—')+'|'+x.customer_id;
      const r=g[k]=g[k]||[x.vehicle_no||'—',(custById(x.customer_id)||{}).name||'?',0,0,0,0]; r[2]++; if(x.product==='petrol') r[3]+=num(x.qty); if(x.product==='diesel') r[4]+=num(x.qty); r[5]+=num(x.amount); }
    const rows=Object.values(g).sort((a,b)=>b[5]-a[5]); const tot=['','',0,0,0,0]; rows.forEach(r=>{ for(let i=2;i<6;i++) tot[i]+=r[i]; });
    return {cols:[[t('vehicle_no')],[t('customer')],[t('fills'),'i'],[t('petrol')+' L','l'],[t('diesel')+' L','l'],[t('amount'),'m']],rows,tot}; },
  staff(f,to){ const g={}; for(const x of S.data.transactions){ if(x.date<f||x.date>to||!['slip','payment'].includes(x.kind)) continue; const r=g[x.created_by]=g[x.created_by]||[profName(x.created_by),0,0,0,0,0,0];
      if(x.status==='rejected'){ r[5]++; continue; } if(x.status==='pending') r[6]++; if(x.kind==='slip'){ r[1]++; r[2]+=num(x.amount); } else { r[3]++; r[4]+=num(x.amount); } }
    const rows=Object.values(g); const tot=['',0,0,0,0,0,0]; rows.forEach(r=>{ for(let i=1;i<7;i++) tot[i]+=r[i]; });
    return {cols:[[t('staff')],[t('k_slip'),'i'],[t('k_slip')+' ₹','m'],[t('k_payment'),'i'],[t('k_payment')+' ₹','m'],[t('rejected'),'i'],[t('pending'),'i']],rows,tot}; }
};
function fmtCell(v,k){ if(k==='m') return money(v); if(k==='l') return ltr(v); if(k==='d') return fd(v); return esc(v); }
V.reports=()=>{
  const f=S.rf||(S.rf={from:today().slice(0,8)+'01',to:today(),type:'daily'});
  const R=REPORTS[f.type](f.from,f.to);
  const names={daily:'r_daily',payments:'r_payments',ageing:'r_ageing',customer:'r_customer',vehicle:'r_vehicle',staff:'r_staff'};
  return {html:`<h1>${t('reports')}</h1>
   <div class="card noprint"><div class="form"><div class="full"><label>${t('reports')}</label><select id="rt">${Object.entries(names).map(([k,v])=>`<option value="${k}" ${f.type===k?'selected':''}>${t(v)}</option>`).join('')}</select></div>
    <div><label>${t('from')}</label><input type="date" id="rfrom" value="${f.from}"></div><div><label>${t('to')}</label><input type="date" id="rto" value="${f.to}"></div>
    <div style="align-self:end" class="row"><button class="btn" id="rcsv">⬇ ${t('export_csv')}</button><button class="btn" id="rprint">🖨</button></div></div></div>
   <div class="card"><h2>${t(names[f.type])} <span class="small muted">${fd(f.from)} → ${fd(f.to)}</span></h2>${R.note?`<div class="small muted" style="margin-bottom:8px">${esc(R.note)}</div>`:''}
    <div class="tw"><table><thead><tr>${R.cols.map(([h,k])=>`<th class="${k&&k!=='d'?'n':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>
    ${R.rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${R.cols[i][1]&&R.cols[i][1]!=='d'?'n':''}">${fmtCell(v,R.cols[i][1])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${R.cols.length}" class="empty">${t('nothing')}</td></tr>`}
    ${R.rows.length&&R.tot?`<tr class="tot">${R.tot.map((v,i)=>`<td class="${R.cols[i][1]&&R.cols[i][1]!=='d'?'n':''}">${i===0?t('total'):v===''?'':fmtCell(v,R.cols[i][1])}</td>`).join('')}</tr>`:''}
    </tbody></table></div><div class="small muted" style="margin-top:6px">${t('approved')} ✓</div></div>`,
   mount(root){
     const upd=()=>{ S.rf={type:$('#rt',root).value,from:$('#rfrom',root).value||f.from,to:$('#rto',root).value||f.to}; render(); };
     $('#rt',root).onchange=upd; $('#rfrom',root).onchange=upd; $('#rto',root).onchange=upd;
     $('#rprint',root).onclick=()=>window.print();
     $('#rcsv',root).onclick=()=>downloadFile(`${f.type}-${f.from}-to-${f.to}.csv`,toCSV(R.cols.map(c=>c[0]),R.rows.map(r=>r.map(v=>typeof v==='number'?r2(v):v))),'text/csv');
   }};
};

/* ---------- staff ---------- */
V.staff=()=>{
  const ps=[...S.data.profiles].sort((a,b)=>(a.role===b.role?0:a.role==='owner'?-1:1));
  return {html:`<h1>${t('staff')}</h1><div class="alert info">${t('staff_help')}</div>
   <div class="tw"><table><thead><tr><th>${t('name')}</th><th>${t('email')}</th><th>${t('role')}</th><th>${t('status')}</th></tr></thead><tbody>
   ${ps.map(p=>{ const me=p.id===S.profile.id; return `<tr><td><b>${esc(p.name||'—')}</b><div class="small muted">${esc(p.phone||'')}</div></td><td class="small">${esc(p.email||'')}</td>
     <td><select data-role="${p.id}" ${me?'disabled':''} style="width:auto"><option value="staff" ${p.role==='staff'?'selected':''}>${t('staffr')}</option><option value="owner" ${p.role==='owner'?'selected':''}>${t('owner')}</option></select></td>
     <td><label class="row" style="margin:0;color:var(--ink)"><input type="checkbox" data-act="${p.id}" ${p.active?'checked':''} ${me?'disabled':''}> ${p.active?t('active'):t('inactive')}</label></td></tr>`; }).join('')}
   </tbody></table></div>`,
   mount(root){
     $$('[data-role]',root).forEach(s=>s.onchange=act(async()=>{ await B.update('profiles',s.dataset.role,{role:s.value}); await reload('profiles'); toast(t('saved')); render(); }));
     $$('[data-act]',root).forEach(cb=>cb.onchange=act(async()=>{ await B.update('profiles',cb.dataset.act,{active:cb.checked}); await reload('profiles'); toast(t('saved')); render(); }));
   }};
};

/* ---------- settings ---------- */
V.settings=()=>{
  const st=settings(), prods=S.data.products, rates=[...S.data.rates].sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:(b.created_at<a.created_at?-1:1)).slice(0,30);
  return {html:`<h1>${t('settings')}</h1>
   <div class="card"><h2>${t('pump_details')}</h2><div class="form">
    <div><label>${t('pump_name')}</label><input id="s1" value="${esc(st.pump_name||'')}"></div><div><label>${t('company')}</label><input id="s2" value="${esc(st.company||'')}"></div>
    <div class="full"><label>${t('address')}</label><input id="s3" value="${esc(st.address||'')}"></div>
    <div><label>${t('gstin')}</label><input id="s4" value="${esc(st.gstin||'')}" style="text-transform:uppercase"></div><div><label>${t('phone')}</label><input id="s5" value="${esc(st.phone||'')}"></div>
    <div><label>${t('lube_gst')}</label><input id="s6" type="number" value="${num(st.lube_gst||18)}"></div><div class="full"><label>${t('bill_footer')}</label><input id="s7" value="${esc(st.bill_footer||'')}"></div>
    <div class="full"><button class="btn p" id="ssave">${t('save')}</button></div></div></div>
   <div class="grid g2">
    <div>${ratesCard()}<div class="card"><h2>${t('rate_hist')}</h2><div class="tw" style="max-height:300px"><table><thead><tr><th>${t('date')}</th><th class="n">${t('petrol')}</th><th class="n">${t('diesel')}</th><th>${t('created_by')}</th></tr></thead><tbody>${rates.map(r=>`<tr><td>${fd(r.date)}</td><td class="n">${money(r.petrol)}</td><td class="n">${money(r.diesel)}</td><td class="small">${esc(profName(r.created_by))}</td></tr>`).join('')}</tbody></table></div></div></div>
    <div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">${t('lubes')}</h2><span class="sp"></span><button class="btn sm" id="addP">＋ ${t('add')}</button></div>
     ${prods.map(p=>`<div class="item"><div class="main"><b>${esc(p.name)}</b> ${p.active===false?`<span class="chip">${t('inactive')}</span>`:''}<div class="small muted">${money(p.price)} · GST ${num(p.gst_rate)}%</div></div><button class="btn sm" data-p="${p.id}">✎</button></div>`).join('')||`<div class="empty">${t('nothing')}</div>`}</div>
   </div>
   <div class="card"><h2>${t('data')}</h2>
    <div class="small muted" style="margin-bottom:10px">${B.kind==='demo'?t('demo_mode'):t('connected_to')+': '+esc(B.url)}</div>
    <div class="row"><button class="btn" id="bk">⬇ ${t('backup')}</button>${B.kind==='demo'?`<button class="btn d" id="rdemo">${t('reset_demo')}</button>`:''}${CONFIG.SUPABASE_URL?'':`<button class="btn" id="disc">${t('disconnect')}</button>`}</div></div>`,
   mount(root){
     bindRates(root);
     $('#ssave',root).onclick=act(async()=>{ await B.update('settings',1,{pump_name:$('#s1',root).value.trim(),company:$('#s2',root).value.trim(),address:$('#s3',root).value.trim(),gstin:$('#s4',root).value.trim().toUpperCase(),phone:$('#s5',root).value.trim(),lube_gst:num($('#s6',root).value),bill_footer:$('#s7',root).value.trim()}); await reload('settings'); toast(t('saved')); render(); });
     $('#addP',root).onclick=()=>productForm(null);
     $$('[data-p]',root).forEach(b=>b.onclick=()=>productForm(S.data.products.find(p=>p.id===b.dataset.p)));
     $('#bk',root).onclick=()=>downloadFile(`pump-credit-backup-${today()}.json`,JSON.stringify(S.data,null,1),'application/json');
     const rd=$('#rdemo',root); if(rd) rd.onclick=()=>{ LS.del('ppcm_demo_v1'); location.hash='#/dashboard'; location.reload(); };
     const ds=$('#disc',root); if(ds) ds.onclick=act(async()=>{ try{ await B.signOut(); }catch(e){} LS.del('ppcm_mode'); LS.del('ppcm_cloud'); location.hash=''; location.reload(); });
   }};
};
function productForm(p){
  const x=p||{name:'',unit:'pc',price:0,gst_rate:num(settings().lube_gst||18),active:true};
  openModal(p?t('edit_item'):t('add'),`<div class="form"><div class="full"><label>${t('name')} *</label><input id="pn" value="${esc(x.name)}"></div>
   <div><label>${t('price_incl')}</label><input id="pp" type="number" step="0.01" value="${num(x.price)}"></div><div><label>${t('gst_pct')}</label><input id="pg" type="number" step="0.01" value="${num(x.gst_rate)}"></div>
   <div><label>${t('status')}</label><select id="pa"><option value="1" ${x.active!==false?'selected':''}>${t('active')}</option><option value="0" ${x.active===false?'selected':''}>${t('inactive')}</option></select></div></div>
   <div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn" data-close>${t('cancel')}</button><button class="btn p" id="psv">${t('save')}</button></div>`,box=>{
    $('#psv',box).onclick=act(async()=>{ const row={name:$('#pn',box).value.trim(),unit:'pc',price:num($('#pp',box).value),gst_rate:num($('#pg',box).value),active:$('#pa',box).value==='1'};
      if(!row.name||row.price<=0) throw new Error(t('err_req'));
      if(p) await B.update('products',p.id,row); else await B.insert('products',row);
      await reload('products'); closeModal(); toast(t('saved')); render(); });
  });
}

/* ============================== auth screens ============================== */
function langPicker(){ return `<div class="row" style="justify-content:center;margin-top:14px">${[['en','English'],['hi','हिन्दी'],['pa','ਪੰਜਾਬੀ']].map(([k,l])=>`<button class="btn sm ${S.lang===k?'p':''}" data-lang="${k}">${l}</button>`).join('')}</div>`; }
function bindLang(root){ $$('[data-lang]',root).forEach(b=>b.onclick=()=>{ S.lang=b.dataset.lang; LS.set('ppcm_lang',S.lang); render(); }); }
function renderWelcome(){
  const app=$('#app');
  app.innerHTML=`<div class="center"><div class="card"><div style="text-align:center;font-size:44px">⛽</div><h1 style="text-align:center">${t('welcome')}</h1><p class="muted" style="text-align:center">${t('welcome_t')}</p>
   <button class="btn p big" id="wDemo">${t('try_demo')}</button>
   <details style="margin-top:14px"><summary class="b" style="cursor:pointer">${t('connect')}</summary><div class="form" style="margin-top:10px">
    <div class="full"><label>${t('sb_url')}</label><input id="wu" placeholder="https://xxxx.supabase.co"></div><div class="full"><label>${t('sb_key')}</label><input id="wk" placeholder="eyJhbGciOi..."></div>
    <div class="full"><button class="btn big" id="wGo">${t('connect')}</button></div></div></details>${langPicker()}</div></div>`;
  bindLang(app);
  $('#wDemo').onclick=act(async()=>{ LS.set('ppcm_mode','demo'); await boot(); });
  $('#wGo').onclick=act(async()=>{ const u=$('#wu').value.trim().replace(/\/+$/,''), k=$('#wk').value.trim(); if(!/^https:\/\//.test(u)||!k) throw new Error(t('err_req'));
    const b=new SupaBackend(u,k); await b.init(); LS.set('ppcm_cloud',{SUPABASE_URL:u,SUPABASE_ANON_KEY:k}); LS.set('ppcm_mode','cloud'); B=b; render(); });
}
function renderLogin(){
  const app=$('#app');
  if(B.kind==='demo'){
    app.innerHTML=`<div class="center"><div class="card"><div style="text-align:center;font-size:40px">⛽</div><h1 style="text-align:center">${t('demo_users')}</h1>
     ${B.db.profiles.filter(p=>p.active).map(p=>`<button class="btn big" style="margin-bottom:8px" data-u="${p.id}">${p.role==='owner'?'👑':'🧑‍🔧'} ${esc(p.name)} — ${p.role==='owner'?t('owner'):t('staffr')}</button>`).join('')}
     <button class="btn big d" id="leave" style="margin-top:6px">${t('leave_demo')}</button>${langPicker()}</div></div>`;
    bindLang(app);
    $$('[data-u]',app).forEach(b=>b.onclick=act(async()=>{ await B.loginAs(b.dataset.u); S.profile=(await B.getSession()).profile; render(); }));
    $('#leave').onclick=()=>{ LS.del('ppcm_mode'); B=null; render(); };
    return;
  }
  let mode='in';
  const draw=()=>{ app.innerHTML=`<div class="center"><div class="card"><div style="text-align:center;font-size:40px">⛽</div><h1 style="text-align:center">${t('app')}</h1>
    <div class="seg" style="display:flex;margin-bottom:14px"><button style="flex:1" data-m="in" class="${mode==='in'?'on':''}">${t('login')}</button><button style="flex:1" data-m="up" class="${mode==='up'?'on':''}">${t('signup')}</button></div>
    <div class="form">${mode==='up'?`<div class="full"><label>${t('name')}</label><input id="an"></div><div class="full"><label>${t('phone')}</label><input id="ap" type="tel"></div>`:''}
     <div class="full"><label>${t('email')}</label><input id="ae" type="email" autocomplete="email"></div><div class="full"><label>${t('password')}</label><input id="aw" type="password" autocomplete="${mode==='in'?'current-password':'new-password'}" placeholder="${mode==='up'?t('new_pw'):''}"></div>
     <div class="full"><button class="btn p big" id="ago">${mode==='in'?t('login'):t('signup')}</button></div></div>
    ${mode==='up'?`<p class="small muted">${t('first_owner')}</p>`:''}${langPicker()}
    ${CONFIG.SUPABASE_URL?'':`<p class="small" style="text-align:center"><a href="#" id="chg">${t('disconnect')}</a></p>`}</div></div>`;
    bindLang(app);
    $$('[data-m]',app).forEach(b=>b.onclick=()=>{ mode=b.dataset.m; draw(); });
    const chg=$('#chg',app); if(chg) chg.onclick=e=>{ e.preventDefault(); LS.del('ppcm_mode'); LS.del('ppcm_cloud'); B=null; render(); };
    $('#ago',app).onclick=act(async()=>{ const e=$('#ae').value.trim(), w=$('#aw').value; if(!e||!w) throw new Error(t('err_req'));
      if(mode==='up'){ const r=await B.signUp(e,w,$('#an').value.trim(),$('#ap').value.trim()); if(!r.session){ toast(t('check_email'),6000); mode='in'; draw(); return; } } else await B.signIn(e,w);
      const s=await B.getSession(); S.profile=s&&s.profile; render(); });
  };
  draw();
}
function renderWaiting(){
  const app=$('#app');
  app.innerHTML=`<div class="center"><div class="card" style="text-align:center"><div style="font-size:40px">⏳</div><p>${t('waiting')}</p><p class="small muted">${esc(S.profile.email||'')}</p>
   <div class="row" style="justify-content:center"><button class="btn p" id="wr">${t('refresh')}</button><button class="btn" id="wl">${t('logout')}</button></div></div></div>`;
  $('#wr').onclick=act(async()=>{ const s=await B.getSession(); S.profile=s&&s.profile; render(); });
  $('#wl').onclick=act(async()=>{ await B.signOut(); S.profile=null; render(); });
}

/* ============================== render / boot ============================== */
let liveBound=false;
async function render(){
  document.documentElement.lang=S.lang;
  const app=$('#app');
  if(!B) return renderWelcome();
  if(!S.profile) return renderLogin();
  if(!S.profile.active) return renderWaiting();
  if(!S.ready){ app.innerHTML=`<div class="center"><div class="muted">Loading…</div></div>`; try{ await loadAll(); }catch(e){ app.innerHTML=`<div class="center"><div class="card"><div class="alert bad">${esc(niceErr(e))}</div><button class="btn" onclick="location.reload()">${t('refresh')}</button></div></div>`; return; }
    if(B.subscribe&&!liveBound){ liveBound=true; let tm; B.subscribe(()=>{ clearTimeout(tm); tm=setTimeout(async()=>{ await reload('transactions'); if(['approvals','dashboard'].includes(curView())&&$('#modal').classList.contains('hidden')) render(); },700); }); } }
  let [,view,arg]=(location.hash||'#/dashboard').split('/'); view=view||'dashboard';
  if(!V[view]||(OWNER_ONLY.has(view)&&!isOwner())||(view==='more'&&!isOwner())) view='dashboard';
  app.innerHTML=shellHTML(view);
  const out=V[view](arg?decodeURIComponent(arg):undefined), main=$('#main');
  main.innerHTML=out.html; if(out.mount) out.mount(main);
  bindShell(); window.scrollTo(0,0);
}
async function boot(){
  const mode=(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY)?'cloud':LS.get('ppcm_mode');
  B=null; S.profile=null; S.ready=false;
  try{
    if(mode==='cloud'){ const cfg=CONFIG.SUPABASE_URL?CONFIG:LS.get('ppcm_cloud'); if(cfg&&cfg.SUPABASE_URL){ const b=new SupaBackend(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY); await b.init(); B=b; } }
    else if(mode==='demo'){ const b=new LocalBackend(); await b.init(); B=b; }
    if(B){ const s=await B.getSession(); S.profile=s?s.profile:null; }
  }catch(e){ console.error(e); toast('⚠ '+niceErr(e),6000); }
  render();
}
window.addEventListener('hashchange',()=>{ if(B&&S.profile) render(); });
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
